}
.tracking-\[0\.25em\] {
  letter-spacing: 0.25em;
}
.tracking-\[0\.3em\] {
  letter-spacing: 0.3em;
}
.tracking-widest {
  letter-spacing: 0.1em;
}
.text-\[var\(--cyan\)\] {
  color: var(--cyan);
}
.text-\[var\(--gold\)\] {
  color: var(--gold);
}
.text-\[var\(--ice\)\] {
  color: var(--ice);
}
.text-\[var\(--muted\)\] {
  color: var(--muted);
}
.text-\[var\(--red\)\] {
  color: var(--red);
}
.text-\[var\(--text\)\] {
  color: var(--text);
}
.text-black {
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}
.accent-\[\#66ccff\] {
  accent-color: #66ccff;
}
.opacity-\[0\.07\] {
  opacity: 0.07;
}
.drop-shadow {
  --tw-drop-shadow: drop-shadow(0 1px 2px rgb(0 0 0 / 0.1)) drop-shadow(0 1px 1px rgb(0 0 0 / 0.06));
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}
.filter {
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}
.transition-all {
  transition-property: all;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}
.transition-colors {
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}
.transition-opacity {
  transition-property: opacity;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}
.duration-500 {
  transition-duration: 500ms;
}
:root {
  --bg: #000000;
  --surface: #06090d;
  --panel: #0a0e14;
  --panel2: #0d1219;
  --line: #1d2c3f;
  --cyan: #66ccff;
  --ice: #d7f3ff;
  --gold: #f2c14e;
  --orange: #ff8c42;
  --red: #ff5a5a;
  --green: #7dff8a;
  --yellow: #ffe95e;
  --text: #e9f5ff;
  --muted: #8fa8bd;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --surface: #06090d;
    --panel: #0a0e14;
    --panel2: #0d1219;
    --line: #1d2c3f;
    --cyan: #66ccff;
    --ice: #d7f3ff;
    --gold: #f2c14e;
    --orange: #ff8c42;
    --red: #ff5a5a;
    --green: #7dff8a;
    --yellow: #ffe95e;
    --text: #e9f5ff;
    --muted: #8fa8bd;
  }
}
html, body {
  background: var(--bg);
  color: var(--text);
}
@keyframes eq {
  0%, 100% {
    transform: scaleY(0.25);
  }
  50% {
    transform: scaleY(1);
  }
}
@keyframes dashmove {
  to {
    stroke-dashoffset: -28;
  }
}
@keyframes spinSlow {
  to {
    transform: rotate(360deg);
  }
}
@keyframes flicker {
  0%, 100% {
    opacity: 1;
  }
  90% {
    opacity: 1;
  }
  92% {
    opacity: 0.35;
  }
  94% {
    opacity: 1;
  }
  96% {
    opacity: 0.55;
  }
  98% {
    opacity: 1;
  }
}
@keyframes pulseGlow {
  0%, 100% {
    opacity: 0.55;
  }
  50% {
    opacity: 1;
  }
}
.edge-active {
  stroke-dasharray: 7 7;
  animation: dashmove 0.9s linear infinite;
}
.spin-slow {
  transform-box: fill-box;
  transform-origin: center;
  animation: spinSlow 16s linear infinite;
}
.flicker {
  animation: flicker 4.5s linear infinite;
}
.eq-bar {
  transform-origin: bottom;
  animation: eq 0.9s ease-in-out infinite;
}
.pulse-glow {
  animation: pulseGlow 2.2s ease-in-out infinite;
}
input[type="range"] {
  cursor: pointer;
}
.hover\:border-\[var\(--muted\)\]:hover {
  border-color: var(--muted);
}
.hover\:bg-\[var\(--gold\)\]:hover {
  background-color: var(--gold);
}
.hover\:bg-\[var\(--red\)\]:hover {
  background-color: var(--red);
}
.hover\:text-black:hover {
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}
.hover\:opacity-85:hover {
  opacity: 0.85;
}
@media (min-width: 640px) {
  .sm\:flex-row {
    flex-direction: row;
  }
  .sm\:gap-5 {
    gap: 1.25rem;
  }
  .sm\:p-4 {
    padding: 1rem;
  }
  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }
  .sm\:text-2xl {
    font-size: 1.5rem;
    line-height: 2rem;
  }
  .sm\:text-lg {
    font-size: 1.125rem;
    line-height: 1.75rem;
  }
  .sm\:text-xs {
    font-size: 0.75rem;
    line-height: 1rem;
  }
}
@media (min-width: 768px) {
  .md\:flex {
    display: flex;
  }
  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (min-width: 1024px) {
  .lg\:order-1 {
    order: 1;
  }
  .lg\:order-2 {
    order: 2;
  }
  .lg\:grid-cols-\[280px_minmax\(0\2c 1fr\)_300px\] {
    grid-template-columns: 280px minmax(0,1fr) 300px;
  }
}
